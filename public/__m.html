<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>m</title></head>
  <body style="margin:0">
    <div id="out">pending</div>
    <iframe id="f" src="/" width="1920" height="1080" style="border:0"></iframe>
    <script>
      const f = document.getElementById("f");
      const out = document.getElementById("out");
      let done = false;
      const measure = () => {
        if (done) return;
        done = true;
        try {
          const d = f.contentDocument;
          const R = [];
          const P = (k, v) => R.push(k + "=" + v);
          const mk = (txt, family, size, weight, ls, lh) => {
            const s = d.createElement("span");
            s.style.position = "absolute";
            s.style.left = "-99999px";
            s.style.whiteSpace = "pre";
            s.style.fontFamily = family;
            s.style.fontSize = size + "px";
            s.style.fontWeight = weight;
            s.style.letterSpacing = ls;
            s.style.lineHeight = lh || "normal";
            s.textContent = txt;
            d.body.appendChild(s);
            const w = Math.round(s.getBoundingClientRect().width * 10) / 10;
            const cs = f.contentWindow.getComputedStyle(s);
            const c = d.createElement("canvas").getContext("2d");
            c.font =
              weight + " " + size + "px " + cs.fontFamily.split(",")[0];
            const m = c.measureText(txt);
            s.remove();
            return { w, asc: Math.round(m.actualBoundingBoxAscent * 10) / 10 };
          };

          const SS = '"Silkscreen", monospace';
          const GS = '"Geist", sans-serif';

          const a = mk("SERVICES", SS, 100, "400", "0px");
          const b = mk("MILESTONES", SS, 100, "400", "0px");
          const c1 = mk("7", SS, 100, "400", "0px");
          const d1 = mk("7+", SS, 100, "400", "0px");
          const e1 = mk("24+", SS, 100, "400", "0px");
          const g1 = mk("04 UI/UX", SS, 100, "400", "0px");
          const h1 = mk("MAGNETTO", SS, 100, "400", "0px");
          const i1 = mk(
            "we craft digital experiences that elevate brands and engage",
            GS,
            100,
            "400",
            "0px",
          );
          const j1 = mk(
            "Extensive Industry Experience",
            GS,
            100,
            "400",
            "0px",
          );
          const k1 = mk("Services", GS, 100, "400", "0px");

          P("SS_SERVICES", a.w + "/asc" + a.asc);
          P("SS_MILESTONES", b.w + "/asc" + b.asc);
          P("SS_7", c1.w + "/asc" + c1.asc);
          P("SS_7PLUS", d1.w);
          P("SS_24PLUS", e1.w);
          P("SS_04UIUX", g1.w);
          P("SS_MAGNETTO", h1.w);
          P("GS_DESC1", i1.w);
          P("GS_LABEL", j1.w);

          const h = d.querySelector("h1");
          if (h) {
            const cs = f.contentWindow.getComputedStyle(h);
            P("H1", cs.fontSize + " w=" + Math.round(h.getBoundingClientRect().width) + " ls=" + cs.letterSpacing + " ff=" + cs.fontFamily);
          }
          out.textContent = R.join(" | ");
        } catch (e) {
          out.textContent = "ERR " + e.message;
        }
      };
      f.addEventListener("load", measure);
      setTimeout(measure, 4000);
    </script>
  </body>
</html>
